# Local benchmark suite manifest
# Three tiers: tiny / small / medium
# Add larger ISPD2024 cases to small/medium as they become available.
# Download ISPD2024 benchmarks: https://drive.google.com/drive/folders/1bon65UEAx8cjSvVhYJ-lgC8QMDX0fvUm

cases:
  - name: mempool_tile_rank
    tier: tiny
    cap: InstantGR/benchmarks/mempool_tile_rank.cap
    net: InstantGR/benchmarks/mempool_tile_rank.net
    out: results/baseline/mempool_tile_rank/route.out

  # ISPD2024 benchmarks — download with: python scripts/download_ispd2024_benchmarks.py

  - name: mempool_tile
    tier: small
    cap: benchmarks/ispd2024/mempool_tile.cap
    net: benchmarks/ispd2024/mempool_tile.net
    out: results/baseline/mempool_tile/route.out

  - name: mempool_tile_rank_ispd
    tier: small
    cap: benchmarks/ispd2024/mempool_tile_rank.cap
    net: benchmarks/ispd2024/mempool_tile_rank.net
    out: results/baseline/mempool_tile_rank_ispd/route.out

  - name: ariane133_51
    tier: small
    cap: benchmarks/ispd2024/ariane133_51.cap
    net: benchmarks/ispd2024/ariane133_51.net
    out: results/baseline/ariane133_51/route.out

  - name: ariane133_68
    tier: small
    cap: benchmarks/ispd2024/ariane133_68.cap
    net: benchmarks/ispd2024/ariane133_68.net
