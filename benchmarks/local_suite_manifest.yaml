  - name: ariane_68_rank
    tier: small
    cap: benchmarks/ispd2024/ariane_68_rank.cap
    net: benchmarks/ispd2024/ariane_68_rank.net
    out: results/baseline/ariane_68_rank/route.out

  - name: nvdla
    tier: small
    cap: benchmarks/ispd2024/nvdla.cap
    net: benchmarks/ispd2024/nvdla.net
    out: results/baseline/nvdla/route.out

  - name: nvdla_rank
    tier: small
    cap: benchmarks/ispd2024/nvdla_rank.cap
    net: benchmarks/ispd2024/nvdla_rank.net
    out: results/baseline/nvdla_rank/route.out

  - name: bsg_chip
    tier: medium
    cap: benchmarks/ispd2024/bsg_chip.cap
    net: benchmarks/ispd2024/bsg_chip.net
    out: results/baseline/bsg_chip/route.out

  - name: bsg_chip_rank
    tier: medium
    cap: benchmarks/ispd2024/bsg_chip_rank.cap
    net: benchmarks/ispd2024/bsg_chip_rank.net
